---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dummypod
  namespace: ${ns}
spec:
  selector:
    matchLabels:
      app: dummypod
  template:
    metadata:
      labels:
        app: dummypod
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dummypod
          image: ${SUBM_IMAGE_REPO}/nettest:${SUBM_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          command:
            - sleep
            - infinity
      restartPolicy: Always
