---
name: 'Restore Images'
description: 'Restores cached images'
inputs:
  cache:
    description: 'Location of the cache'
    required: false
    default: '~/image-cache'
  working-directory:
    description: 'Working directory to run in'
    required: false
    default: '.'
runs:
  using: "composite"
  steps:
    - name: Set up the cache
      id: image-cache
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: ${{ inputs.cache }}
        key: image-cache-${{ github.sha }}

    - name: Restore images from cache
      if: steps.image-cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        # A leading ~ in an env value is not tilde-expanded by the shell; do it here.
        INPUT_CACHE="${INPUT_CACHE/#\~/$HOME}"
        for archive in "$INPUT_CACHE"/*.tar*; do docker load -i "$archive"; done
        if [ -d "$INPUT_WORKING_DIRECTORY"/package ]; then \
          cp "$INPUT_CACHE"/.image.* "$INPUT_WORKING_DIRECTORY"/package/; \
        fi
