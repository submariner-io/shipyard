---
name: 'Upgrades End to End'
description: 'Runs an upgrade procedure, followed by end to end tests with multiple clusters'
inputs:
  image-version:
    description: 'Explicit target operator and component image version for subctl deployment'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - shell: bash
      run: echo "DEBUG_PRINT=true" >> $GITHUB_ENV
    - shell: bash
      run: |
        echo "::group::Reclaiming free space"
        # Clean up tools we don't need for our CI to free up more space on the hosted runner
        rm -rf /usr/share/dotnet
        df -h
        echo "::endgroup::"

    - shell: bash
      run: |
        echo "::group::Disable swap"
        sudo swapoff -a
        echo "::endgroup::"

    - shell: bash
      run: |
        echo "::group::Report available RAM"
        free -h
        echo "::endgroup::"

    - shell: bash
      run: |
        echo "::group::Increase inotify settings"
        sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
        echo "::endgroup::"

    - shell: bash
      env:
        SUBCTL_IMAGE_VERSION: ${{ inputs.image-version }}
      run: |
        make upgrade-e2e SUBCTL_IMAGE_VERSION="$SUBCTL_IMAGE_VERSION"
        if [[ -n "$SUBCTL_IMAGE_VERSION" && ! -x output/released-subctl/bin/subctl ]]; then
          echo 'Publish the updated Shipyard Dapper image before running explicit-image upgrade tests' >&2
          exit 1
        fi
