---
name: 'End to End'
description: 'Runs end to end tests with multiple clusters'
inputs:
  cache:
    description: 'Location of the cache'
    required: false
    default: '~/image-cache'
  k8s_version:
    description: 'Version of Kubernetes to use for clusters'
    required: false
    default: 'k8s-latest'
  using:
    description: 'Various options to pass via using="..."'
    required: false
  target:
    description: 'Target for make'
    required: false
    default: 'e2e'
  test_args:
    description: 'Extra arguments to pass to E2E tests'
    required: false
    default: '--ginkgo.fail-fast'
  testdir:
    description: 'Where to look for the E2E tests'
    required: false
    default: 'test/e2e'
  plugin:
    description: 'Path to the plugin that has pre/post hooks'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - shell: bash
      run: echo "DEBUG_PRINT=true" >> $GITHUB_ENV
    - shell: bash
      run: |
        echo "::group::Reclaiming free space"
        # Clean up tools we don't need for our CI to free up more space on the hosted runner
        rm -rf /usr/share/dotnet
        df -h
        echo "::endgroup::"

    - shell: bash
      run: |
        echo "::group::Disable swap"
        sudo swapoff -a
        echo "::endgroup::"

    - shell: bash
      run: |
        echo "::group::Report available RAM"
        free -h
        echo "::endgroup::"

    - shell: bash
      run: |
        echo "::group::Increase inotify settings"
        sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
        echo "::endgroup::"

    - name: Install WireGuard specific modules
      shell: bash
      env:
        INPUT_USING: ${{ inputs.using }}
      run: |
        [[ "$INPUT_USING" =~ "wireguard" ]] || exit 0
        echo "::group::Installing WireGuard modules"
        sudo apt install -y linux-headers-$(uname -r) wireguard
        sudo modprobe wireguard
        echo "::endgroup::"

    - name: Restore images from the cache
      uses: submariner-io/shipyard/gh-actions/restore-images@release-0.22
      with:
        cache: ${{ inputs.cache }}

    - name: Run E2E deployment and tests
      shell: bash
      env:
        INPUT_K8S_VERSION: ${{ inputs.k8s_version }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_USING: ${{ inputs.using }}
        INPUT_PLUGIN: ${{ inputs.plugin }}
        INPUT_TEST_ARGS: ${{ inputs.test_args }}
        INPUT_TESTDIR: ${{ inputs.testdir }}
      run: |
        k8s_version="$INPUT_K8S_VERSION";
        if [ "$k8s_version" = k8s-latest ]; then k8s_version=1.34; fi; \
        if [ "$k8s_version" = k8s-oldest-working ]; then k8s_version=1.19; fi; \
        if [ "$k8s_version" = k8s-oldest-supported ]; then k8s_version=1.31; fi; \
        make "$INPUT_TARGET" \
            using="$INPUT_USING" \
            ${k8s_version:+K8S_VERSION="$k8s_version"} \
            PLUGIN="$INPUT_PLUGIN" \
            TEST_ARGS="$INPUT_TEST_ARGS" \
            E2E_TESTDIR="$INPUT_TESTDIR"
