---
exclude:
  # ovn-kubernetes is a gitignored directory containing a separate repository
  # CVEs in ovn-kubernetes should be fixed in the upstream ovn-org/ovn-kubernetes project
  - "**/ovn-kubernetes/**"

ignore:
  # False positive, CVE is actually about the C++ project protocolbuffers/protobuf
  # https://github.com/anchore/grype/issues/558
  - vulnerability: CVE-2015-5237
    package:
      name: google.golang.org/protobuf
  # False positive, CVE is actually about the C++ project protocolbuffers/protobuf
  # https://github.com/anchore/grype/issues/633
  - vulnerability: CVE-2021-22570
    package:
      name: google.golang.org/protobuf
  # Update requires K8s major version update. Low severity doesn't justify an update for stable branches.
  # https://github.com/submariner-io/shipyard/pull/1932#issuecomment-2830451046
  - vulnerability: GHSA-4hfp-h4cw-hj8p
    package:
      name: helm.sh/helm/v3
  - vulnerability: GHSA-5xqw-8hwv-wg92
    package:
      name: helm.sh/helm/v3
  # Update requires K8s major version update. Low severity doesn't justify an update for stable branches.
  # https://github.com/submariner-io/shipyard/pull/1943#discussion_r2064226633
  - vulnerability: GHSA-m4gq-fm9h-8q75
    package:
      name: github.com/docker/buildx
  # Update requires Go 1.25.5. High severity doesn't justify breaking changes on stable branches.
  - vulnerability: GHSA-4vrq-3vrq-g6gg
    package:
      name: github.com/moby/buildkit
  - vulnerability: GHSA-4c29-8rgm-jvjj
    package:
      name: github.com/moby/buildkit
  # No fix available yet in released versions.
  - vulnerability: GHSA-x744-4wpc-v9h2
    package:
      name: github.com/docker/docker
  - vulnerability: GHSA-pxq6-2prw-chj9
    package:
      name: github.com/docker/docker
